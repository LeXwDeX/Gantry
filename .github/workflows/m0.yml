name: M0

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 安装 OpenSSL（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssl
      - name: 安装 OpenSSL（macOS）
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          printf '%s\n' "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: 安装 OpenSSL（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install openssl --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $bin = Join-Path $env:ProgramFiles 'OpenSSL-Win64\bin'
          if (-not (Test-Path (Join-Path $bin 'openssl.exe'))) {
            throw "OpenSSL executable not found in $bin"
          }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: 检查 OpenSSL
        run: openssl version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features

  contracts:
    name: 契约与 Mock API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tools/mock-api
      - run: cargo xtask schemas --check
      - run: npm test --prefix tools/mock-api
      - run: git diff --exit-code -- schemas fixtures

  frontend:
    name: 前端检查（前端交付后启用）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 检测前端交付
        id: frontend
        shell: bash
        run: |
          if [ -f apps/desktop/package.json ]; then
            printf 'available=true\n' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' '::notice::apps/desktop 尚未交付，未运行前端 lint/typecheck。'
          fi
      - name: 安装前端依赖
        if: steps.frontend.outputs.available == 'true'
        working-directory: apps/desktop
        run: npm ci
      - name: 前端静态检查
        if: steps.frontend.outputs.available == 'true'
        working-directory: apps/desktop
        run: npm run lint && npm run typecheck
