name: M0

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: 安装 OpenSSL（Linux）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y openssl
      - name: 安装 OpenSSL（macOS）
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3
          printf '%s\n' "$(brew --prefix openssl@3)/bin" >> "$GITHUB_PATH"
      - name: 安装 OpenSSL（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:ProgramFiles 'OpenSSL-Win64\bin'),
            (Join-Path $env:ProgramFiles 'OpenSSL-Win32\bin'),
            'C:\Program Files\Git\usr\bin'
          )
          $bin = $candidates | Where-Object { Test-Path (Join-Path $_ 'openssl.exe') } | Select-Object -First 1
          if (-not $bin) { throw "OpenSSL executable not found" }
          $bin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & (Join-Path $bin 'openssl.exe') version
      - name: 检查 OpenSSL
        run: openssl version
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: 测试前采集 Linux 资源用量
        if: runner.os == 'Linux'
        run: |
          df -h .
          df -i .
          free -h
          du -sh target || true
          du -sh target/debug/deps target/debug/incremental || true
      - if: runner.os == 'Linux'
        run: cargo test --locked --workspace --all-features --config 'profile.test.incremental=false' --config 'profile.test.debug=1'
      - if: runner.os != 'Linux'
        run: cargo test --locked --workspace --all-features
      - name: 测试后采集 Linux 资源用量
        if: ${{ always() && runner.os == 'Linux' }}
        run: |
          df -h .
          df -i .
          free -h
          du -sh target || true
          du -sh target/debug/deps target/debug/incremental || true

  msrv:
    name: Rust 1.85 (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --locked --workspace --all-targets --all-features

  contracts:
    name: 契约与 Mock API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tools/mock-api --no-audit --no-fund
      - run: cargo xtask schemas --check
      - run: npm test --prefix tools/mock-api
      - run: git diff --exit-code -- schemas fixtures

  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 升级 npm（规避 npm 10 的 Exit handler 故障）
        run: npm install -g npm@11
      - name: 安装前端依赖
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund
      - name: 前端边界检查
        working-directory: apps/desktop
        run: npm run lint
      - name: 前端类型检查
        working-directory: apps/desktop
        run: npm run typecheck
      - name: 前端测试
        working-directory: apps/desktop
        run: npm test
      - name: 前端构建
        working-directory: apps/desktop
        run: npm run build
