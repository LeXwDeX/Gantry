# CI（GitHub Actions）。由 .azure-pipelines/ci.yml 迁移而来，只保留 Linux 作业：
# 本项目不做 Windows / macOS 构建（AGENTS.md）。Azure Pipelines 暂保留，验证稳定后再决定去留。
# 门禁作业跑在自托管 runner（标签 azure-f16）；fork PR 与手动运行落回 GitHub 托管的 ubuntu-latest。
# 发布流程走 GitHub 托管 runner，不使用自托管标签。

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  rust:
    name: Rust (linux)
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","azure-f16"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Rust stable（含 rustfmt、clippy）与 OpenSSL
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version
          sudo apt-get update && sudo apt-get install -y openssl
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features

  msrv:
    name: Rust 1.85 (MSRV)
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","azure-f16"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 安装 Rust 1.85
        run: |
          set -euo pipefail
          rustup toolchain install 1.85 --profile minimal
          rustup default 1.85
          rustc --version
      - run: cargo check --locked --workspace --all-targets --all-features

  contracts:
    name: 契约与 Mock API
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","azure-f16"]') || 'ubuntu-latest' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: 安装 Rust stable
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: npm ci --prefix tools/mock-api --no-audit --no-fund
      - run: cargo xtask schemas --check
      - run: npm test --prefix tools/mock-api
      - run: git diff --exit-code -- schemas fixtures

  frontend:
    name: 前端检查
    runs-on: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","Linux","X64","azure-f16"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: npm install -g npm@11
      - run: npm ci --no-audit --no-fund
        working-directory: apps/desktop
      - run: npm run lint
        working-directory: apps/desktop
      - run: npm run typecheck
        working-directory: apps/desktop
      - run: npm test
        working-directory: apps/desktop
      - run: npm run build
        working-directory: apps/desktop