            "required": ["action", "target", "subject_digest"],
            "properties": {
              "action": { "const": "device_role_change" },
              "target": { "properties": { "kind": { "const": "device" } }, "required": ["kind"] },
              "subject_digest": { "type": "string", "pattern": "^sha256:[0-9a-f]{64}$" }
            }
