[package]
name = "gantry-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gantry API 网关（api.md）：设备鉴权、路由注册表、统一错误、事件流与签名审批的 HTTP 外壳"

[dependencies]
gantry-core = { path = "../gantry-core" }
gantry-store = { path = "../gantry-store" }
async-trait.workspace = true
base64 = "0.22"
bytes = "1"
http = "1"
jsonschema = { version = "0.59", default-features = false }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
gantry-core = { path = "../gantry-core", features = ["testing"] }
gantry-store = { path = "../gantry-store", features = ["testing"] }
gantry-fakes = { path = "../gantry-fakes" }
tokio = { workspace = true, features = ["rt", "sync", "time", "macros", "test-util"] }
