[package]
name = "gantry-egress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gantry 出网代理（独立进程 gantry-egress）：控制面、模型反向代理与计量、CONNECT 白名单、出网审计"

[dependencies]
gantry-core = { path = "../gantry-core" }
getrandom = "0.3"
rusqlite = { version = "0.37", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { workspace = true, features = ["io-util", "net"] }
idna = "1"
# 固定 unicode-rs 后端：ICU 后端（idna_adapter 1.2+）要求 rustc 1.86，超出 MSRV 1.85。
idna_adapter = "~1.1"
thiserror.workspace = true

[dev-dependencies]
gantry-core = { path = "../gantry-core", features = ["testing"] }
gantry-fakes = { path = "../gantry-fakes" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
