[package]
name = "gantryd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gantry 服务端单进程：配置加载、模块装配与本机控制通道"

[[bin]]
name = "gantryd"
path = "src/main.rs"

[[bin]]
name = "gantry"
path = "src/bin/gantry.rs"

[dependencies]
gantry-core = { path = "../gantry-core" }
gantry-store = { path = "../gantry-store" }
gantry-engine = { path = "../gantry-engine" }
gantry-deploy = { path = "../gantry-deploy" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "signal"] }
toml = "1"
getrandom = "0.3"

# 服务端只在 Linux 上运行；其余 Unix 用于本机开发。Windows 上两个二进制只是提示后退出的桩。
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

# 替身装配只在进程级测试里（tests/support），不进服务端二进制（AGENTS.md：fakes 只作 dev-dependency）。
[dev-dependencies]
gantry-fakes = { path = "../gantry-fakes" }
gantry-forge = { path = "../gantry-forge" }
gantry-notify = { path = "../gantry-notify" }
gantry-policy = { path = "../gantry-policy" }
gantry-repo = { path = "../gantry-repo" }
gantry-sandbox = { path = "../gantry-sandbox", features = ["testing"] }
gantry-store = { path = "../gantry-store", features = ["testing"] }
base64 = "0.22"
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "net", "io-util", "signal"] }

[features]
# 仅测试：允许 `gantry` CLI 通过 `GANTRY_CONTROL_UID` 注入期望的对端 uid。
# 发布构建不带此 feature。
testing = []
