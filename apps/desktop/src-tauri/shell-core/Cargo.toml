[package]
name = "gantry-desktop-shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Gantry 桌面外壳（desktop-shell.md）中与 Tauri 无关的可信逻辑：设备密钥、配对、mTLS、事件流、审批签名"

[features]
# 软件密钥替身（desktop-shell.md §6.5 TestSoftwareKeys）。只给测试与 CI 用；正式外壳不得启用。
test-software-keys = ["dep:p256", "dep:rand_core"]

[dependencies]
gantry-core = { path = "../../../../crates/gantry-core" }
serde_json.workspace = true
thiserror.workspace = true
serde.workspace = true
sha2.workspace = true
base64 = "0.22"
getrandom = "0.2"
url = "2"
idna = "1"
pem = "3"
# 与 gantry-pki 相同的特性组合，避免同一 lock 里出现两套编译。
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "crypto", "x509-parser"] }
x509-parser = { version = "0.16", features = ["verify"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
jsonschema = { version = "0.59", default-features = false }
async-trait.workspace = true
tokio = { workspace = true, features = ["net", "time", "rt", "sync", "macros"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
p256 = { version = "0.13", features = ["ecdsa"], optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"
security-framework-sys = "2.17"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "LAContext"] }

[dev-dependencies]
# 测试用 HTTPS 服务端。
hyper = { version = "1", features = ["client", "http1", "server"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio = { workspace = true, features = ["net", "time", "rt", "rt-multi-thread", "sync", "macros"] }
sha2.workspace = true
base64 = "0.22"
# 配对测试用的替身服务端：TestCA 与 pki 的签发 / CSR 校验（只作测试，外壳代码不依赖 pki）。
gantry-fakes = { path = "../../../../crates/gantry-fakes" }
gantry-pki = { path = "../../../../crates/gantry-pki" }
gantry-core = { path = "../../../../crates/gantry-core", features = ["testing"] }
serde_json.workspace = true
# 测试服务端要能只开 TLS 1.2，验证客户端拒绝降级。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
p256 = { version = "0.13", features = ["ecdsa"] }
