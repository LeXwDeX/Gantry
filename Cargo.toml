[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["apps"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
schemars = "1.2"
thiserror = "2"
async-trait = "0.1"
futures-core = "0.3"
sha2 = "0.10"
serde_jcs = "0.2"
tokio = { version = "1", features = ["rt", "macros", "sync", "time"] }
time = "0.3"

# pki 引导用 scrypt 加密根私钥（pki.md §6.6）；未优化时单次要数十秒，测试与开发构建也开优化。
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.pbkdf2]
opt-level = 3
